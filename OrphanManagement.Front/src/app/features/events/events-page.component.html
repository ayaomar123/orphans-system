<div class="container page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Events</h1>
      <div class="subtitle">Plan and track activities</div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center">
      <mat-form-field appearance="outline" style="min-width: 260px">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" placeholder="Title or description" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button *ngIf="canManage()" mat-raised-button color="primary" (click)="openCreate()">
        <mat-icon>add</mat-icon>
        <span style="margin-left: 6px">New</span>
      </button>
    </div>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="om-table-wrap">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z0" style="min-width: 980px">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let e">
              <div style="font-weight: 600">{{ e.title }}</div>
              <div class="om-muted" style="font-size: 12px">{{ e.description || '—' }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="eventType">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let e">{{ e.eventType }}</td>
          </ng-container>

          <ng-container matColumnDef="startDate">
            <th mat-header-cell *matHeaderCellDef>Start</th>
            <td mat-cell *matCellDef="let e">{{ e.startDate | date: 'mediumDate' }}</td>
          </ng-container>

          <ng-container matColumnDef="endDate">
            <th mat-header-cell *matHeaderCellDef>End</th>
            <td mat-cell *matCellDef="let e">{{ e.endDate | date: 'mediumDate' }}</td>
          </ng-container>

          <ng-container matColumnDef="location">
            <th mat-header-cell *matHeaderCellDef>Location</th>
            <td mat-cell *matCellDef="let e">{{ e.location }}</td>
          </ng-container>

          <ng-container matColumnDef="participantCount">
            <th mat-header-cell *matHeaderCellDef>Participants</th>
            <td mat-cell *matCellDef="let e">{{ e.participantCount }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef style="width: 120px">Actions</th>
            <td mat-cell *matCellDef="let e">
              <button
                *ngIf="canManage()"
                mat-icon-button
                matTooltip="Edit"
                (click)="openEdit(e)"
              >
                <mat-icon>edit</mat-icon>
              </button>

              <button
                *ngIf="canDelete()"
                mat-icon-button
                matTooltip="Delete"
                (click)="delete(e)"
              >
                <mat-icon color="warn">delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>

      <mat-paginator
        [length]="totalCount"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="pageChanged($event)"
      />

      <div *ngIf="loading" class="om-muted" style="padding: 12px">Loading...</div>
    </mat-card-content>
  </mat-card>
</div>
