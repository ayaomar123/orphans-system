<div class="login">
  <div class="login-inner">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Welcome back</mat-card-title>
        <mat-card-subtitle>Sign in to manage orphans, events and users</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" class="form">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="username" />
            <mat-icon matSuffix>mail</mat-icon>
            <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" />
            <mat-icon matSuffix>lock</mat-icon>
            <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" class="submit" [disabled]="loading">
            <span *ngIf="!loading">Sign in</span>
            <span *ngIf="loading" class="spinner">
              <mat-progress-spinner diameter="20" mode="indeterminate" />
            </span>
          </button>

          <div class="hint">
            <div class="hint-title">Default Admin</div>
            <div class="hint-row"><span>Email:</span> <code>admin@orphan.com</code></div>
            <div class="hint-row"><span>Password:</span> <code>Admin@123</code></div>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="login-footer">
      <span class="om-muted">Orphan Management System • Angular Frontend</span>
    </div>
  </div>
</div>
