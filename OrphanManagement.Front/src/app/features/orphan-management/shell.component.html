<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) ? false : true"
    class="shell-sidenav"
  >
    <div class="sidenav-header">
      <div class="brand">
        <span class="brand-title">Orphan Management</span>
        <span class="brand-subtitle">Care • Events • Users</span>
      </div>
    </div>

    <mat-divider></mat-divider>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="drawer.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/orphans" routerLinkActive="active" (click)="drawer.close()">
        <mat-icon matListItemIcon>child_care</mat-icon>
        <span matListItemTitle>Orphans</span>
      </a>

      <a mat-list-item routerLink="/events" routerLinkActive="active" (click)="drawer.close()">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Events</span>
      </a>

      <a
        *ngIf="auth.role() === 'Admin'"
        mat-list-item
        routerLink="/users"
        routerLinkActive="active"
        (click)="drawer.close()"
      >
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Users</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <div class="user">
        <div class="user-name">{{ auth.user()?.fullName }}</div>
        <div class="user-role">{{ auth.user()?.role }}</div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" class="toolbar-menu">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="toolbar-title">Orphan Management</span>
      <span class="spacer"></span>

      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="toolbar-user">{{ auth.user()?.fullName }}</span>
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="menu-user">
          <div class="menu-user-name">{{ auth.user()?.fullName }}</div>
          <div class="menu-user-email">{{ auth.user()?.email }}</div>
          <div class="menu-user-role">Role: {{ auth.user()?.role }}</div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="shell-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
