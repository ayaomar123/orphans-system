<h2 mat-dialog-title>{{ isEdit ? 'Edit user' : 'New user' }}</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="form">
    <div class="grid">
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Full name</mat-label>
        <input matInput formControlName="fullName" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      @if (!isEdit) {
        <mat-form-field appearance="outline" class="span-2">
          <mat-label>Temporary password</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>
      }

      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          @for (o of roleOptions; track o.value) {
            <mat-option [value]="o.value">{{ o.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>

      <div class="span-2" style="display: flex; align-items: center; justify-content: space-between">
        <div>
          <div style="font-weight: 600">Account status</div>
          <div class="om-muted" style="font-size: 12px">Inactive users cannot access the system</div>
        </div>
        <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
      </div>
    </div>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
    @if (!saving) {
      <span>Save</span>
    }
    @if (saving) {
      <span style="display: inline-flex; align-items: center">
        <mat-progress-spinner diameter="18" mode="indeterminate" />
      </span>
    }
  </button>
</div>

<style>
  .form {
    padding-top: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: min(700px, 100%);
  }

  .span-2 {
    grid-column: span 2;
  }

  @media (max-width: 720px) {
    .grid {
      grid-template-columns: 1fr;
    }

    .span-2 {
      grid-column: span 1;
    }
  }
</style>
